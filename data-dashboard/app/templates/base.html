<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Data Dashboard{% endblock %}</title>

  {# Chart.js from CDN — no npm/bundler needed for this project #}
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">📊 World Data Dashboard</span>
    <span class="navbar-sub">Powered by World Bank Open Data · Flask · Pandas · Chart.js</span>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
